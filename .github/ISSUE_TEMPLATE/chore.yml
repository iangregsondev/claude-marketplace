name: Tooling or repo change
description: CI, docs, or repository configuration.
title: "chore: "
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first.

        To propose a plugin for the catalogue, use the **Plugin proposal** template instead.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CI or workflows
        - Repository settings
        - Documentation
        - Manifest validation
        - Community health files
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      description: >
        The current behaviour, and what it costs. Include the failing command or
        output where there is one.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What should change?
      description: >
        The concrete change. If it spans several files or settings, list them.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: How will we know it worked?
      description: >
        The command that should pass, or the observable state that should differ.
    validations:
      required: false

  - type: checkboxes
    id: coupling
    attributes:
      label: Does this couple the catalogue to a plugin's contents?
      description: >
        This repo exists so that a change in a plugin's repo needs no commit
        here. Anything that reads or restates a plugin's contents breaks that,
        and is worth arguing for explicitly rather than slipping in.
      options:
        - label: >
            This adds nothing that tracks a catalogued plugin's contents, or the
            proposal above says why the coupling is worth it.
          required: false

  - type: checkboxes
    id: reconfiguration
    attributes:
      label: Does this need changes outside the repository?
      description: >
        Repository settings, org rulesets, or third-party services are not files
        and will not arrive in a pull request. Flag them so they are not lost.
      options:
        - label: This needs a repository or organisation setting changed as well.
          required: false
